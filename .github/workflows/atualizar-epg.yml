
name: Atualizar EPG Stremio
# A rotina lê somente o catálogo Stremio e associa a programação das fontes XMLTV públicas.

"on":
  push:
    branches: [main]
    paths:
      - "src/**"
      - "config.json"
      - ".github/workflows/**"
  workflow_dispatch:
  schedule:
    # Todos os dias às 06:20 UTC (03:20 no horário de Brasília).
    - cron: "20 6 * * *"

permissions:
  contents: write

concurrency:
  group: atualizar-epg
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Gerar EPG somente dos canais Stremio
        run: python src/gerar_epg.py

      - name: Publicar EPG e relatórios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/epg.xml
          git add public/epg-stremio.json
          git add public/canais_com_epg.csv
          git add public/canais_sem_epg.csv
          git add public/canais_xmltv_disponiveis.csv
          git add public/canais_sem_grade_real.csv

          if git diff --cached --quiet; then
            echo "EPG e relatórios sem alterações."
          else
            git commit -m "Atualiza EPG e relatórios de canais"
            # Integra commits feitos enquanto a geração estava em andamento.
            # Tenta novamente para evitar perder a EPG quando outro commit chega primeiro.
            for tentativa in 1 2 3 4 5; do
              git fetch origin main
              git rebase -X theirs origin/main
              if git push origin HEAD:main; then
                echo "EPG publicada com sucesso."
                break
              fi
              if [ "$tentativa" -eq 5 ]; then
                echo "Não foi possível publicar após 5 tentativas."
                exit 1
              fi
              sleep 3
            done
          fi
